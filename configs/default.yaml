# IrisFlow — default configuration.
# Every field is validated by src/irisflow/config/schema.py (Sprint 1).
# Overrides: CLI > env (IRISFLOW_<SECTION>__<FIELD>) > this file > code defaults.

camera:
  device_id: 0
  width: 1280
  height: 720
  fps: 30
  reconnect_backoff_ms: 500

detection:
  refine_landmarks: true          # required for iris landmarks
  roi_margin: 0.20                # bbox expansion around raw landmarks
  smoothing_alpha: 0.4            # EMA on ROI boxes
  lost_hysteresis_frames: 5       # frames without face before LOST

model:
  backend: keras                  # keras | onnx
  path: models/gaze_cnn_best.keras
  warmup_iterations: 3
  channel_order: RGB              # confirm on Sprint 6 sanity check
  normalization: unit             # unit ([0,1]) | signed ([-1,1]) | imagenet
  face_input_size: [224, 224]
  eye_input_size:  [112, 112]

calibration:
  points: 9                       # 5 | 9 | 13
  samples_per_point: 30
  stabilization_ms: 600
  model_kind: polynomial          # affine | polynomial | ridge
  polynomial_degree: 2
  max_residual_px: 60
  profiles_dir: configs/profiles

mapping:
  screen_id: 0
  clamp_margin_px: 8

filtering:
  chain: [outlier, one_euro, fixation]
  outlier:
    max_velocity_px_per_s: 6000
  one_euro:
    min_cutoff: 1.0
    beta: 0.007
    d_cutoff: 1.0
  fixation:
    velocity_threshold_px_per_s: 40

control:
  enabled: false                  # cursor stays untouched unless explicitly on
  rate_limit_hz: 60
  dwell:
    radius_px: 40
    duration_ms: 800
    refractory_ms: 400
  safety:
    kill_switch: ctrl+alt+esc
    pause_on_face_lost_ms: 2000
    rest_zone_px: [0, 0, 0, 0]    # x, y, w, h — zero means disabled

telemetry:
  metrics_enabled: true
  record_sessions: false
  recordings_dir: data/recordings

logging:
  level: INFO
  json_file: data/logs/irisflow.jsonl
  human_console: true
