name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, architecture, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install project (dev + api + inference-onnx extras)
        run: uv sync --extra dev --extra api --extra inference-onnx

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/irisflow

      - name: Import-linter (layered architecture contract)
        run: uv run lint-imports

      - name: Pytest
        env:
          TERMINAL_WIDTH: "200"
        run: uv run pytest --cov=irisflow --cov-report=term-missing
