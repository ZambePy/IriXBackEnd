[project]
name = "irisflow"
version = "0.1.0"
description = "IrisFlow — webcam-based eye tracking backend for accessibility (ALS)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "IrisFlow Team", email = "irisflowteam@gmail.com" }]
license = { text = "Proprietary" }

dependencies = [
    "opencv-python>=4.9",
    "mediapipe>=0.10",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "pynput>=1.7",
]

[project.optional-dependencies]
inference-keras = ["tensorflow>=2.15"]
inference-onnx  = ["onnxruntime>=1.17"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "httpx>=0.27",
    "types-PyYAML",
]

[project.scripts]
irisflow = "irisflow.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irisflow"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "N",             # pep8-naming
    "TID",           # tidy imports
    "PT",            # pytest style
]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy — strict on the pure-domain layers, permissive on adapters that wrap
# external libraries without type stubs.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["src/irisflow"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "irisflow.core.*",
    "irisflow.config.*",
    "irisflow.preprocessing.*",
    "irisflow.calibration.*",
    "irisflow.filtering.*",
    "irisflow.mapping.*",
]
strict = true
disallow_any_explicit = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "model: tests that require the real trained model (skipped by default in CI)",
    "hardware: tests that require a physical webcam",
    "slow: tests that take more than a few seconds",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/irisflow"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

# ---------------------------------------------------------------------------
# import-linter — enforces the layered architecture from SPRINTS.md §2.1.
# Dependencies must point downward only: application → orchestration →
# domain → adapters. The `core` package must depend on nothing internal.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "irisflow"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "irisflow.cli",
    "irisflow.api",
    "irisflow.pipeline",
    "irisflow.preprocessing | irisflow.calibration | irisflow.mapping | irisflow.filtering",
    "irisflow.capture | irisflow.detection | irisflow.inference | irisflow.control",
    "irisflow.config | irisflow.telemetry | irisflow.logging",
    "irisflow.core",
]

[[tool.importlinter.contracts]]
name = "core has no internal dependencies"
type = "forbidden"
source_modules = ["irisflow.core"]
forbidden_modules = [
    "irisflow.config",
    "irisflow.capture",
    "irisflow.detection",
    "irisflow.preprocessing",
    "irisflow.inference",
    "irisflow.calibration",
    "irisflow.mapping",
    "irisflow.filtering",
    "irisflow.control",
    "irisflow.pipeline",
    "irisflow.telemetry",
    "irisflow.logging",
    "irisflow.api",
    "irisflow.cli",
]

[[tool.importlinter.contracts]]
name = "domain modules must not import adapter concretions"
type = "forbidden"
source_modules = [
    "irisflow.preprocessing",
    "irisflow.calibration",
    "irisflow.mapping",
    "irisflow.filtering",
]
forbidden_modules = [
    "irisflow.capture",
    "irisflow.detection",
    "irisflow.inference",
    "irisflow.control",
    "irisflow.api",
]

[[tool.importlinter.contracts]]
name = "production code must not import test stubs"
type = "forbidden"
source_modules = ["irisflow"]
forbidden_modules = ["tests"]
